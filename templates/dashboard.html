{% extends "base.html" %}
{% block content %}
<div class="card">
    <img src="https://cdn.discordapp.com/avatars/{{ user.id }}/{{ user.avatar }}.png" alt="Avatar">
    <h2>Welcome, {{ user.username }}!</h2>
    <p>You’re logged in with Discord.</p>
    <a href="/logout">Logout</a>
</div>
{% endblock %}
